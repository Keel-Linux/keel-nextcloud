; keel-nextcloud: PHP for Nextcloud 35 (admin manual; first test of 0087)
memory_limit = 512M
upload_max_filesize = 512M
post_max_size = 512M
max_execution_time = 3600
max_input_time = 3600
output_buffering = 0
opcache.interned_strings_buffer = 16
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.save_comments = 1
apc.shm_size = 64M
; keel-nextcloud: occ and cron.php use APCu too (memcache.local)
apc.enable_cli = 1
