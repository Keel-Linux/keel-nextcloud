# keel-nextcloud: Redis for the cache, the file locks and the PHP sessions
# of Nextcloud (decision 0087). The socket only; the group redis, which has
# www-data, may connect. The ACL is 50-keel-nextcloud-acl.conf, which the
# first boot writes (digests only). The data is not durable: the gate
# empties it when the node becomes the writer.
unixsocket /run/redis/redis-server.sock
unixsocketperm 770
save ""
appendonly no
