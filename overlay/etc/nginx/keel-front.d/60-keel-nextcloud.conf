# keel-nextcloud: the front of keel-web in the cloud modes (decision 0087).
# Tested by hand on an LNMP pair (second test of 0087).
#
# The body limit: the route and PHP take 512 MiB. A sync client sends a
# larger file in chunks (the chunked upload v2).
#
# The sync clients of Nextcloud (desktop, Android, iOS) send a user agent
# with "Mozilla", and Anubis answered them with its challenge page (HTTP
# 200, HTML), so no client could sync. Their paths go from the front to the
# server of the application on keel-web's socket, with no Anubis, and with
# the headers of keel-anubis.conf. Coraza of the front still reads them
# (coreruleset/plugins/keel-nextcloud-before.conf), and Nextcloud asks for
# a login on each. A browser keeps the challenge on every other path.
client_max_body_size 512m;

# The forbidden paths of the site (keel-default.d/60-keel-nextcloud.conf)
# get its 404 here too, before Coraza and Anubis read them. Coraza of the
# front answered 403 for /config/config.php (rule 930130) and
# /data/nextcloud.log (rule 920440), while a single node answers 404: now
# every mode gives the same answer, and the front never sends these paths
# on (commissioning, 2026-11-12). The paths that start with a dot are not
# here: Anubis serves its challenge under /.within.website/, and
# /.well-known/ goes on to the site, which redirects it. The site still
# answers 404 for the others.
location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/) { return 404; }
location ~ ^/(?:autotest|occ|issue|indie|db_|console) { return 404; }
location ~ ^/(?:composer\.(?:json|lock)|package(?:-lock)?\.json|core/shipped\.json)$ { return 404; }

location ~ ^/(?:remote\.php|public\.php|status\.php|ocs/v[12]\.php|ocs-provider/|(?:index\.php/)?login/v2(?:/poll)?$) {
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_http_version 1.1;
	proxy_request_buffering off;
	proxy_buffering off;
	proxy_read_timeout 3600s;
	proxy_pass http://unix:/run/nginx/keel-app.sock;
}
