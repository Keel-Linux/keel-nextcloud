# keel-nextcloud: the Nextcloud site in the default site of keel-web
# (handbook decisions 0059 and 0086). Ported from the nginx example of the
# admin manual of Nextcloud 35 ("Version 2026-06-09") and tested by hand on
# the LNMP image (first test of 0086).
#
# keel-web owns "location /" and "index index.html" of its default site, so
# this route is made of exact locations, ^~ prefixes and regular
# expressions only. The ACME location of keel-web on port 80 is a longer
# prefix than /.well-known/ and wins.
#
# The site is open only while the gate has written /run/keel-nextcloud/open:
# the first boot has made the site, and the database of this node takes
# writes. Everywhere else the answer is 503. A node with a read-only
# database cannot serve sync clients, not even for reads (first test).
#
# fastcgi_param HTTPS comes from Debian's fastcgi_params ($https
# if_not_empty), so port 80 serves the site while the certificate is
# self-signed (0079). fastcgi_intercept_errors stays off: the error pages
# of keel-web would replace the answers of WebDAV.

add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header X-Robots-Tag "noindex, nofollow" always;
fastcgi_hide_header X-Powered-By;
client_max_body_size 512m;
client_body_timeout 300s;
client_body_buffer_size 512k;
fastcgi_buffers 64 4K;

location = / {
	if ($http_user_agent ~ ^DavClnt) {
		return 302 /remote.php/webdav/$is_args$args;
	}
	if (!-f /run/keel-nextcloud/open) {
		return 503;
	}
	root /var/www/nextcloud;
	index index.php index.html /index.php$request_uri;
}

location = /robots.txt {
	root /var/www/nextcloud;
	log_not_found off;
	access_log off;
}

location = /.well-known/carddav { return 301 /remote.php/dav/; }
location = /.well-known/caldav { return 301 /remote.php/dav/; }
location ^~ /.well-known/ {
	return 301 /index.php$request_uri;
}

location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/) { return 404; }
location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console) { return 404; }
location ~ ^/(?:composer\.(?:json|lock)|package(?:-lock)?\.json|core/shipped\.json)$ { return 404; }

location ~ \.php(?:$|/) {
	if (!-f /run/keel-nextcloud/open) {
		return 503;
	}
	root /var/www/nextcloud;
	rewrite ^/(?!index|remote|public|cron|status|ocs\/v[12]|ocs-provider\/.+|core\/ajax\/update|updater\/.+|.+\/richdocumentscode(_arm64)?\/proxy) /index.php$request_uri;
	fastcgi_split_path_info ^(.+?\.php)(/.*)$;
	set $path_info $fastcgi_path_info;
	try_files $fastcgi_script_name =404;
	include fastcgi_params;
	fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	fastcgi_param PATH_INFO $path_info;
	fastcgi_param modHeadersAvailable true;
	fastcgi_param front_controller_active true;
	fastcgi_pass unix:/run/php/php-fpm.sock;
	fastcgi_request_buffering on;
	fastcgi_max_temp_file_size 0;
	fastcgi_read_timeout 3600s;
}

location ~ \.(?:css|js|mjs|svg|gif|ico|jpg|png|webp|wasm|tflite|map|ogg|flac|mp4|webm)$ {
	root /var/www/nextcloud;
	include mime.types;
	types {
		text/javascript mjs;
	}
	try_files $uri /index.php$request_uri;
	add_header Cache-Control "public, max-age=15778463";
	add_header Referrer-Policy "no-referrer" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Permitted-Cross-Domain-Policies "none" always;
	add_header X-Robots-Tag "noindex, nofollow" always;
	access_log off;
}

location ~ \.(?:otf|woff2?)$ {
	root /var/www/nextcloud;
	try_files $uri /index.php$request_uri;
	expires 7d;
	access_log off;
}

location ~ ^/remote(?:/|$) {
	return 301 /remote.php$request_uri;
}

location ~ ^/ {
	if (!-f /run/keel-nextcloud/open) {
		return 503;
	}
	root /var/www/nextcloud;
	index index.php index.html /index.php$request_uri;
	try_files $uri $uri/ /index.php$request_uri;
}
