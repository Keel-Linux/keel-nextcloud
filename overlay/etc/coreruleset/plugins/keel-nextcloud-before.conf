# keel-nextcloud: WebDAV of Nextcloud behind Coraza (decision 0087; second
# test, the Core Rule Set 4.25.1 of keel-overlay-coraza 0.1.4).
#
# The Core Rule Set allows the methods GET HEAD POST OPTIONS only (rule
# 911100), so every PROPFIND and PUT of a sync client answered 403. On the
# DAV paths of Nextcloud, and only there, the DAV methods are allowed too.
#
# A PUT of a file to /remote.php/dav/ is not read by the rules: its body is
# the file. Before this rule, one PUT of 100 MiB made one worker of nginx
# grow to 3.5 GB, the container ran out of memory, and keel moved the VIP.
# A PUT with no Content-Type (rule 920340) passes on that path too.
#
# Loaded by /usr/share/coreruleset/coreruleset.load before the rules. The
# ids are in Keel's range for local rules (10000 to 10199). This is not the
# official plugin of the Core Rule Set for Nextcloud, which is an open
# point of 0087.
SecRule REQUEST_FILENAME "@rx ^/(?:remote|public)\.php/(?:dav|webdav)(?:/|$)" \
    "id:10111,phase:1,pass,nolog,t:none,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT DELETE PROPFIND PROPPATCH MKCOL COPY MOVE LOCK UNLOCK REPORT SEARCH'"
SecRule REQUEST_METHOD "@streq PUT" \
    "id:10112,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_FILENAME "@rx ^/remote\.php/(?:dav|webdav)/" \
        "ctl:requestBodyAccess=Off,ctl:ruleRemoveById=920340"
