manifest_version: 1
kind: appliance
name: nextcloud
title: Keel Nextcloud
summary: Nextcloud on nginx, PHP-FPM, MariaDB and Redis (the LNMP stack), alone or as a replicated pair (0059, 0087)
base: lnmp
# Redis is this layer's: one on each node, on its socket, not durable.
# Only the node that takes writes serves (the gate), so only its Redis is
# used. The port 6379 is not opened.
processes:
  - name: redis
    unit: redis-server.service
    listen: [{port: 6379, protocol: tcp, expose: loopback}]
checks:
  - {name: redis, process: redis, type: command,
     command: [/usr/bin/redis-cli, -s, /run/redis/redis-server.sock, INFO, server],
     on_failure: restart}
secrets:
  - name: nextcloud_secret
    description: The secret of Nextcloud (config secret), the same on both nodes of a pair
    generate: required
    shared: true
  - name: nextcloud_passwordsalt
    description: The password salt of Nextcloud, the same on both nodes of a pair
    generate: required
    shared: true
  - name: redis_password
    description: The Redis account "nextcloud" (cache and file locks)
    generate: required
    shared: true
  - name: redis_session_password
    description: The Redis account "nextcloud-session" (the PHP sessions only)
    generate: required
    shared: true
# state: the directories Nextcloud writes at run time (first test of
# 0087): the data directory (the files, appdata_<instanceid> with the
# previews, the cache of the app store and the key pair of the server) and
# the apps from the app store. On a database pair one Syncthing folder
# replicates each, send-only on the primary and receive-only on the
# replica (0050). The log is in /var/log/nextcloud, outside both.
state:
  replicate:
    - /var/lib/nextcloud/data
    - /var/www/nextcloud/custom_apps
options:
  - name: admin_user
    type: string
    default: admin
    pattern: '^[A-Za-z0-9._@-]+$'
  - name: db_name
    type: string
    default: nextcloud
    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
hooks:
  first_boot: [/usr/lib/inithooks/firstboot.d/40nextcloud]
