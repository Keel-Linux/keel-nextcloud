# An instance description of keel-nextcloud in the simple mode (keel
# docs/spec.md). The three passwords are files of root, mode 0600; the
# four shared secrets of the pair are generated by keel at apply time.
# Set app.domain to the name the site is reached by.
version: 1
network:
  managed_by: host
  interfaces:
    eth0:
      ipv6:
        method: auto
tls:
  acme:
    enabled: false
appliance:
  name: nextcloud
installation:
  mode: simple
overlays:
  installer: enabled
  wireguard: disabled
  etcd: disabled
  crowdsec: disabled
  vip: disabled
  nginx: enabled
  coraza: disabled
  anubis: disabled
  syncthing: disabled
secrets:
  root_password: {file: /etc/keel/secrets/root_password}
  db_password: {file: /etc/keel/secrets/db_password}
  app_password: {file: /etc/keel/secrets/app_password}
  nextcloud_secret: {generate: true}
  nextcloud_passwordsalt: {generate: true}
  redis_password: {generate: true}
  redis_session_password: {generate: true}
app:
  email: admin@example.org
  domain: localhost
  options:
    db_user: admin
    admin_user: admin
    db_name: nextcloud
hub:
  api_key: skip
security:
  alerts: admin@example.org
  updates_at_first_boot: skip
first_login_wizard: false
