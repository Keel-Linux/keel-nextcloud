# The commissioning contract of keel-nextcloud (handbook decision 0075).
# The shared runner, bin/keel-commission of Keel-Linux/.github, reads it.
# Round 2026-11-12 (image 19.0-1) failed on every pass. This version has
# the fixes of that round: no secret of the manifest in the instance
# (inithooks refuses those names), and the cloud nodes.
#
# The replica of a cloud pair answers 503 by design (only the node that
# takes writes serves, 0087), so the replica nodes have urls and proofs of
# their own (keel-commission of Keel-Linux/.github takes them in place of
# the ones below): the site answers 503 there, and the app secret is
# proved against the administrator's hash in the database of the node
# (cross.seeded proves that this database is the primary's).
contract: 1
appliance: nextcloud
secrets: [root, db, app]
questions:
  - id: root_password
    hook: 30rootpass
    prompt: Root Password
    answer: secret:root
  - id: db_password
    hook: 35mysqlpass
    prompt: MariaDB password
    answer: secret:db
  - id: mode
    hook: 75keel-role
    prompt: Installation mode
    type: choice
    answer: '{ret}'
  - id: nextcloud_password
    hook: 40nextcloud
    prompt: Nextcloud password
    answer: secret:app
  - id: alert_email
    hook: 85secalerts
    prompt: System Notifications
    answer: admin@example.org
# keel/instance.example.yaml of keel-nextcloud, with the secrets of the run.
# The secret and the salt of Nextcloud and the Redis passwords are not
# here: the first boot makes them (40nextcloud).
instance:
  version: 1
  network:
    managed_by: host
    interfaces:
      eth0:
        ipv6:
          method: auto
  tls:
    acme:
      enabled: false
  appliance:
    name: nextcloud
  installation:
    mode: simple
  overlays:
    installer: enabled
    wireguard: disabled
    etcd: disabled
    crowdsec: disabled
    vip: disabled
    nginx: enabled
    coraza: disabled
    anubis: disabled
    syncthing: disabled
  secrets:
    root_password: secret:root
    db_password: secret:db
    app_password: secret:app
  app:
    email: admin@example.org
    domain: localhost
    options:
      db_user: admin
      admin_user: admin
      db_name: nextcloud
  hub:
    api_key: skip
  security:
    alerts: admin@example.org
    updates_at_first_boot: skip
  first_login_wizard: false
proofs:
  - {secret: root, kind: shadow, user: root}
  - {secret: db, kind: mysql, user: admin, host: 127.0.0.1}
  # the administrator logs in to WebDAV with the app secret
  - secret: app
    kind: command
    run: 'test "$(curl -sk -o /dev/null -w "%{http_code}" -u "admin:$SECRET" -X PROPFIND -H "Depth: 0" https://127.0.0.1/remote.php/dav/files/admin/)" = 207'
services: [nginx, mariadb, php8.4-fpm, redis-server, webmin, cron, postfix]
urls:
  # status.php answers 200 even with Redis down or a read-only database
  # (first test of 0087): it is not a health check, so the contract asks
  # for the login page too
  - {url: 'https://127.0.0.1/status.php', status: 200}
  - {url: 'https://127.0.0.1/login', status: 200}
  - {url: 'http://127.0.0.1/login', status: 200}
  - {url: 'http://127.0.0.1/keel-health', status: 204}
  - {url: 'https://127.0.0.1/data/nextcloud.log', status: 404}
  - {url: 'https://127.0.0.1/config/config.php', status: 404}
  - {url: 'https://127.0.0.1:12321/', status: 200}
forbidden:
  - {kind: path, name: /usr/local/lib/keel-build}
  - {kind: mysql-database, name: keel_check}
  - {kind: hook, name: 40lnmp-check}
  - {kind: mysql-database, name: test}
screenshots:
  - {name: site, url: /}
  - name: nextcloud-admin
    url: /login
    after: /apps/files/
    login: {user_field: '#user', user: admin, password_field: '#password', secret: app, submit: 'button[type=submit]'}
  - name: webmin
    port: 12321
    url: /
    login: {user_field: 'input[name=user]', user: root, password_field: 'input[name=pass]', secret: root, submit: 'button[type=submit]'}
    wait: 8
    text: System hostname
# The cloud modes (decision 0076), in the shape of keel-wordpress. The
# prompts are the titles of the confconsole screens. keel-init runs
# 40nextcloud before 75keel-role, so each node makes its own site first;
# the seed of keel gives the replica the database of the primary, and the
# gate writes the secret and the salt of that database into its
# keel-pair.config.php.
#
# Round 2026-11-12 (19.0-2): seeded, pair-same, row-replicated and
# old-primary-follows failed because the role screen of keel-init wrote no
# database.server: keel inspect finds two servers (MariaDB and the Redis
# of this layer) and names none, so the pair was a pair of files only. With
# database.server written by hand on the kept pair, every check of this
# list passed (BR1 9440 + BR2 9441, 2026-11-13). The fix is in core, not
# in this file.
cloud:
  capture:
    # keel1: an invite without a VIP, keel2: one that carries it (keel 0.23.83)
    invite: 'keel[12]:[A-Za-z0-9_.~+/=-]+'
    # the label anchors it: the usage screen shows the node's own addresses too
    vip: 'VIP:? +([0-9a-f]{1,4}(:[0-9a-f]{0,4}){2,7})'
  # the screens on which a node waits for another: no key while they are up
  waits: [Waiting for the nodes]
  # modes: a check runs only in the cloud modes it names; one without
  # modes runs in both (keel-commission of Keel-Linux/.github)
  checks:
    - {id: voters, at: all, run: 'keel mesh status --json | grep -o "\"healthy_voters\": *[0-9]*"', match: ': *3$', count: 3, modes: [cloud_advanced]}
    - {id: witness-no-data, at: witness, run: 'test ! -e /usr/sbin/nginx && test ! -e /usr/sbin/mariadbd && echo nodata', match: '^nodata$', modes: [cloud_advanced]}
    - {id: vip-holder, at: all, run: 'keel vip status', match: 'carried here: yes', count: 1}
    # the replica holds the primary's site: the administrator account, as a
    # hash, is the primary's on both nodes
    - {id: seeded, at: 'primary,replica', run: 'mysql -N -e "SELECT SHA2(CONCAT(uid, 0x20, password), 256) FROM nextcloud.oc_users WHERE uid = ''admin''"', same: true}
    # one instanceid, secret and salt for the pair, as a hash, never the
    # values: the gate of the replica wrote the rows of the primary
    - id: pair-same
      at: 'primary,replica'
      run: 'sleep 10; php -r ''$CONFIG = []; include "/var/www/nextcloud/config/keel-pair.config.php"; echo hash("sha256", $CONFIG["instanceid"] . $CONFIG["secret"] . $CONFIG["passwordsalt"]), "\n";'''
      same: true
    - {id: account-same, at: 'primary,replica', run: 'mysql -N -e "SHOW GRANTS FOR ''www-data''@''localhost''"', same: true}
    # only the node that takes writes serves (0087)
    - {id: gate-primary, at: primary, run: '/usr/lib/keel-nextcloud/keel-nextcloud-gate --state', match: '^open$'}
    - {id: gate-replica, at: replica, run: '/usr/lib/keel-nextcloud/keel-nextcloud-gate --state', match: '^closed$'}
    - {id: row-written, at: primary, run: 'mysql -e "CREATE DATABASE IF NOT EXISTS kc_probe; CREATE TABLE IF NOT EXISTS kc_probe.t (v INT); INSERT INTO kc_probe.t VALUES (42)"'}
    - {id: row-replicated, at: replica, run: 'sleep 5; mysql -N -e "SELECT v FROM kc_probe.t"', match: '^42$'}
    - {id: files-follow, at: replica, run: 'k=$(cat /var/lib/keel/filesync/apikey); curl -s -H "X-API-Key: $k" http://127.0.0.1:8384/rest/config/folders', match: 'receiveonly'}
    - {id: files-sent, at: primary, run: 'k=$(cat /var/lib/keel/filesync/apikey); curl -s -H "X-API-Key: $k" http://127.0.0.1:8384/rest/config/folders', match: 'sendonly'}
    - {id: promote, at: replica, run: 'keel vip promote'}
    - {id: promoted-holder, at: replica, run: 'keel vip status', match: 'carried here: yes'}
    # the administrator logs in to WebDAV on the new primary once its gate
    # has opened
    - id: login-new-primary
      at: replica
      secret: app
      run: 'for i in $(seq 30); do [ -e /run/keel-nextcloud/open ] && break; sleep 2; done; curl -sk -o /dev/null -w "%{http_code}\n" -u "admin:$SECRET" -X PROPFIND -H "Depth: 0" https://127.0.0.1/remote.php/dav/files/admin/'
      match: '^207$'
    # the old primary replicates from the new one and has applied all it
    # received before it takes the VIP back (keel 0.23.84)
    - {id: old-primary-follows, at: primary, run: 'for i in $(seq 60); do s=$(mysql -e "SHOW SLAVE STATUS\\G"); grep -q "Slave_SQL_Running: Yes" <<< "$s" && grep -q "Seconds_Behind_Master: 0" <<< "$s" && grep -q "has read all relay log" <<< "$s" && echo caught-up && exit 0; sleep 5; done; exit 1', match: '^caught-up$'}
    - {id: return, at: primary, run: 'keel vip promote'}
    - {id: returned-holder, at: primary, run: 'keel vip status', match: 'carried here: yes'}
    - {id: probe-dropped, at: primary, run: 'mysql -e "DROP DATABASE kc_probe"'}
    - {id: no-failed-units, at: all, run: 'systemctl --failed --no-legend --plain | wc -l', match: '^0$'}
nodes:
  - name: primary
    site: br1
    mode: cloud_simple
    role: primary
    # the hotkeys of the menus (the first letter of an item): an arrow key is
    # an escape sequence, and the console of a container can hand dialog its
    # ESC alone, which cancels the screen (BR1, 2026-11-06)
    answers:
      - {id: mode, prompt: Installation mode, keys: 'C{ret}'}
      - {id: role, prompt: Role of this node, keys: 'P{ret}'}
      - {id: invite, prompt: Invite a node, keys: '{ret}'}
  - name: replica
    site: br2
    mode: cloud_simple
    role: replica
    answers:
      - {id: mode, prompt: Installation mode, keys: 'C{ret}'}
      - {id: role, prompt: Role of this node, keys: 'R{ret}'}
      - {id: join, prompt: Join a mesh, keys: '{invite:1}{ret}'}
    # the gate of the replica is closed: the site answers 503, the paths
    # that are never served 404, and the panel and the health check answer
    urls: &replica-urls
      - {url: 'https://127.0.0.1/status.php', status: 503}
      - {url: 'https://127.0.0.1/login', status: 503}
      - {url: 'http://127.0.0.1/login', status: 503}
      - {url: 'http://127.0.0.1/keel-health', status: 204}
      - {url: 'https://127.0.0.1/data/nextcloud.log', status: 404}
      - {url: 'https://127.0.0.1/config/config.php', status: 404}
      - {url: 'https://127.0.0.1:12321/', status: 200}
    # no login over HTTP on a closed node: the app secret is the password
    # of the administrator in the database of this node (Nextcloud stores
    # "3|" and a password_hash). A replica that was not seeded holds a site
    # of its own with the same secret, so this proof does not prove the
    # seed: cross.seeded does. The hash goes to php in its environment,
    # never as an argument.
    proofs: &replica-proofs
      - {secret: root, kind: shadow, user: root}
      - {secret: db, kind: mysql, user: admin, host: 127.0.0.1}
      - secret: app
        kind: command
        run: 'H="$(mysql -N -e "SELECT password FROM nextcloud.oc_users WHERE uid = ''admin''")" php -r ''$h = explode("|", (string) getenv("H"), 2); exit(count($h) == 2 && password_verify((string) getenv("SECRET"), $h[1]) ? 0 : 1);'''
    # the gate of the replica is closed: no login shot, the panel only
    screenshots:
      - name: webmin
        port: 12321
        url: /
        login: {user_field: 'input[name=user]', user: root, password_field: 'input[name=pass]', secret: root, submit: 'button[type=submit]'}
        wait: 8
        text: System hostname
  # cloud advanced (decision 0076): the primary and the Keel Core witness
  # on BR1, the replica on BR2. The names differ from the nodes of cloud
  # simple: a record names each check NODE:CHECK.
  - name: adv-primary
    site: br1
    mode: cloud_advanced
    role: primary
    answers:
      - {id: mode, prompt: Installation mode, keys: 'CC{ret}'}
      - {id: role, prompt: Role of this node, keys: 'P{ret}'}
      - {id: invite, prompt: Invite a node, keys: '{ret}'}
      - {id: invite2, prompt: Invite a node, keys: '{ret}'}
  - name: adv-replica
    site: br2
    mode: cloud_advanced
    role: replica
    answers:
      - {id: mode, prompt: Installation mode, keys: 'CC{ret}'}
      - {id: role, prompt: Role of this node, keys: 'R{ret}'}
      - {id: join, prompt: Join a mesh, keys: '{invite:1}{ret}'}
    urls: *replica-urls
    proofs: *replica-proofs
    screenshots:
      - name: webmin
        port: 12321
        url: /
        login: {user_field: 'input[name=user]', user: root, password_field: 'input[name=pass]', secret: root, submit: 'button[type=submit]'}
        wait: 8
        text: System hostname
  - name: witness
    site: br1
    mode: cloud_advanced
    role: witness
    # the witness is a node of keel-core, with the contract of keel-core
    # (a copy of its tests/commission.yaml): the image of keel-core is a new
    # build for each release, so the run gives it as KC_IMAGE_WITNESS
    contract: commission-core.yaml
    answers:
      - {id: mode, prompt: Installation mode, keys: 'CC{ret}'}
      - {id: role, prompt: Role of this node, keys: 'W{ret}'}
      - {id: join, prompt: Join a mesh, keys: '{invite:2}{ret}'}
